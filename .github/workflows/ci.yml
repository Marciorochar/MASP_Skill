name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Validate routing matrix
        run: python -m masp_skill.cli validate-routing --routing docs/masp/masp-routing.toml --classification STATIC
      - name: Validate distributed case fixture
        run: python -m masp_skill.cli validate-case --case tests/fixtures/cases/valid-case.json --root .
