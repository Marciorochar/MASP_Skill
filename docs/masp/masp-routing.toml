schema_version = 1
classification = "STATIC"
phase_order = ["Identificação", "Observação", "Análise", "Plano de ação", "Ação", "Verificação", "Padronização", "Conclusão"]

[roles.masp-coordenador]
model = "gpt-6.1-sol"
effort = "medium"
responsibility = "Controlar gates, delegação, custo, contexto e consolidação."

[roles.masp-identificador]
model = "gpt-6-luna"
effort = "low"
responsibility = "Delimitar problema, impacto, escopo e métrica."

[roles.masp-observador]
model = "gpt-6-luna"
effort = "medium"
responsibility = "Coletar baseline, reprodução e evidências."

[roles.masp-analista]
model = "gpt-6.1-sol"
effort = "medium"
responsibility = "Avaliar hipóteses e estabelecer causa raiz."

[roles.masp-planejador]
model = "gpt-6.1-sol"
effort = "medium"
responsibility = "Produzir plano, riscos, rollback e critérios de teste."

[roles.masp-executor]
model = "gpt-6.1-terra"
effort = "medium"
responsibility = "Implementar mudanças aprovadas e delimitadas."

[roles.masp-testador]
model = "gpt-6-luna"
effort = "low"
responsibility = "Verificar mudanças independentemente do executor."

[roles.masp-padronizador]
model = "gpt-6.1-terra"
effort = "medium"
responsibility = "Criar controles, regressões e documentação reutilizável."

[roles.masp-relator]
model = "gpt-6.1-sol"
effort = "medium"
responsibility = "Consolidar resultados, limitações e pendências."

[roles.masp-especialista-critico]
model = "gpt-6-astra"
effort = "medium"
responsibility = "Auditar problemas críticos sem implementar correções."

[[phases]]
id = "identificacao"
name = "Identificação"
role = "masp-identificador"
gate = "PASS quando problema observado versus esperado, impacto, escopo, exclusões e critério verificável numérico ou qualitativo estiverem registrados; caso contrário BLOCKED com lacuna e desbloqueio. Baseline ausente: PENDENTE_DE_OBSERVACAO, sem bloqueio automático."
inputs = ["Relato inicial do problema", "Contexto e restrições conhecidos"]
outputs = ["Ficha Markdown com problema, impacto, escopo, exclusões e critério verificável", "Fontes, classes, limitações e pendências para Observação"]
tools = ["filesystem", "version_control"]
access_modes = ["read-only"]
returns = ["Identificação"]
[[phases.skills]]
name = "superpowers:brainstorming"
path = "C:/Users/marci/.codex/plugins/cache/openai-curated-remote/superpowers/7.0.1/skills/brainstorming/SKILL.md"

[[phases]]
id = "observacao"
name = "Observação"
role = "masp-observador"
gate = "PASS somente com fontes atribuídas e evidências suficientes para análise, baseline quantitativo ou qualitativo (ou ausência justificada), ambiente, método e reprodução segura ou limitação; BLOCKED com desbloqueio quando prova insuficiente. Validação de sidecar não aprova gate."
inputs = ["Ficha de Identificação v2 ou equivalente", "Fontes, contexto, restrições e pendências de coleta"]
outputs = ["Plano e inventário de fontes", "Baseline ou limitação fundamentada", "Método, qualidade e registros observados", "Lacunas para Análise"]
tools = ["filesystem", "version_control", "test_runner"]
access_modes = ["read-only", "execute-approved"]
returns = ["Identificação"]
