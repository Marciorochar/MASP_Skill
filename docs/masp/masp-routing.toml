[policies.parallelism]
max_agents = 3
effective_runtime_limit_applies = true
same_write_file = "reject"

[policies.unavailable_model]
state = "BLOCKED"
automatic_fallback = false
requires_human_approval_for_substitution = true

[policies.audit]
independent = true
high_risk_requires_astra = true
astra_trigger_is_automatic_for_first_test_failure = false

[policies.astra_escalation]
conditions = ["concurrency_or_deadlock", "security", "complex_reverse_engineering", "critical_architecture_decision", "grave_contradictory_evidence", "high_risk_change", "persistent_problem_after_systematic_diagnosis"]
required_record = ["astra_reason", "related_evidence", "coordinator_decision"]
high_risk_requires_astra = true
astra_unavailable_state = "BLOCKED"
substitution_requires_human_approval = true
first_test_failure_triggers = false

[policies.delegation]
coordinator_only = true
children_may_spawn = false
executor_may_self_approve = false

[policies.states]
values = ["PENDING", "IN_PROGRESS", "PASS", "FAIL", "BLOCKED", "NOT_RUN"]
