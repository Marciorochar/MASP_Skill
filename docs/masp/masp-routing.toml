[[phases]]
id = "plano-de-acao"
name = "Plano de ação"
role = "masp-planejador"
gate = "Plano 5W2H viável, alternativas justificadas, menor mudança adequada, escopo, responsáveis, riscos, rollback ou contingência, testes e autorização humana REAL registrada; validação STATIC não concede PASS."
inputs = ["Problema M01, baseline/limitações M02 e conclusão M03", "Restrições, critérios de sucesso e autorizações aplicáveis"]
outputs = ["Comparação de alternativas e plano 5W2H", "Riscos, prevenção, mitigação, rollback/contingência", "Testes planejados e condições de parada", "Estado real da autorização humana"]
tools = ["filesystem", "version_control"]
access_modes = ["read-only"]
