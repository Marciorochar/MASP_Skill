schema_version = 1
classification = "STATIC"
phase_order = ["Identificação", "Observação", "Análise", "Plano de ação", "Ação", "Verificação", "Padronização", "Conclusão"]

[roles.masp-coordenador]
model = "gpt-6.1-sol"
effort = "medium"
responsibility = "Controlar gates, delegação, custo, contexto e consolidação."

[roles.masp-identificador]
model = "gpt-6-luna"
effort = "low"
responsibility = "Delimitar problema, impacto, escopo e métrica."

[roles.masp-observador]
model = "gpt-6-luna"
effort = "medium"
responsibility = "Coletar baseline, reprodução e evidências."

[roles.masp-analista]
model = "gpt-6.1-sol"
effort = "medium"
responsibility = "Avaliar hipóteses e estabelecer causa raiz."

[roles.masp-planejador]
model = "gpt-6.1-sol"
effort = "medium"
responsibility = "Produzir plano, riscos, rollback e critérios de teste."

[roles.masp-executor]
model = "gpt-6.1-terra"
effort = "medium"
responsibility = "Implementar mudanças aprovadas e delimitadas."

[roles.masp-testador]
model = "gpt-6-luna"
effort = "low"
responsibility = "Verificar mudanças independentemente do executor."

[roles.masp-padronizador]
model = "gpt-6.1-terra"
effort = "medium"
responsibility = "Criar controles, regressões e documentação reutilizável."

[roles.masp-relator]
model = "gpt-6.1-sol"
effort = "medium"
responsibility = "Consolidar resultados, limitações e pendências."

[roles.masp-especialista-critico]
model = "gpt-6-astra"
effort = "medium"
responsibility = "Auditar problemas críticos sem implementar correções."

