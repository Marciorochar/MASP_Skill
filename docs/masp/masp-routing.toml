[[phases]]
id = "analise"
name = "Análise"
role = "masp-analista"
gate = "Comparar hipóteses rivais, evidências favoráveis e contrárias, alternativas, avaliações realizadas e limites; PASS com causa(s) sustentada(s) ou inconclusão legitimamente analisada; BLOCKED quando faltar evidência essencial. Sidecar STATIC não aprova gate."
inputs = ["Ficha de Identificação v2 ou equivalente", "Observação v2, baseline quantitativo/qualitativo/indisponível, fontes e limitações"]
outputs = ["Matriz de hipóteses e evidências favoráveis/contrárias", "Avaliação causal documentada ou inconclusão justificada", "Lacunas e alternativas para decisão"]
tools = ["filesystem", "version_control"]
access_modes = ["read-only"]
